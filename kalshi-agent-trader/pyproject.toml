[project]
name = "kalshi-agent-trader"
version = "0.1.0"
description = "Hybrid Kalshi trading system: deterministic compliance/risk/execution core with LLM agents proposing signals."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "cryptography>=42",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13",
    "anthropic>=0.40",
    "websockets>=12",
]

[project.scripts]
kalshi-trader = "kalshi_agent_trader.cli:app"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
# Archived exploratory strategies (and their tests) live under attic/ and import
# modules that no longer wire into the package. Keep them out of collection.
testpaths = ["tests"]
addopts = "--ignore=tests/attic"
