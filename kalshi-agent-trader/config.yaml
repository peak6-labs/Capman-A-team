# Kalshi agent-trader configuration.
# Secrets live in .env, NOT here. This file holds risk limits + compliance + tunables.
# Everything here is enforced in deterministic code (compliance.py / risk.py).

# ---------------------------------------------------------------------------
# COMPLIANCE — PEAK6 hard constraints. Enforced before any risk check and NOT
# overridable by agents. See README "Compliance".
# ---------------------------------------------------------------------------
compliance:
  # A market may trade ONLY if its event category is in allowed_categories
  # AND not in prohibited_categories AND passes the keyword screen.
  # Categories are resolved market -> event -> category (category is on the event).
  allowed_categories:
    - Politics
    - World
    - Climate and Weather
    - Sports
  prohibited_categories:   # hard deny — PEAK6: equities/ETFs/indices/options/companies/finance
    - Financials
    - Companies
    - Crypto
    - Economics
  # Default-deny everything else (Elections, Science and Technology, Entertainment,
  # Social, Health, Transportation) unless explicitly added to allowed_categories.
  default_deny_unknown: true
  # Keyword backstop on market/event title + series (case-insensitive substring).
  # Catches a prohibited market that slips into an allowed category.
  prohibited_keywords:
    - earnings
    - ipo
    - " s&p"
    - nasdaq
    - dow jones
    - merger
    - acquisition
    - stock
    - share price
    - "etf"

# ---------------------------------------------------------------------------
# RISK — configurable caps. FILL THESE IN before going live. Exposure is also
# bounded by actual account balance regardless of these values (no leverage).
# ---------------------------------------------------------------------------
risk:
  dry_run: true                  # true = log intended orders, place nothing. Flip to false ONLY to go live.
  max_total_exposure_usd: 200.0  # funded test size for the dip strategy
  max_per_position_usd: 25.0     # max capital on a single dip
  max_contracts_per_order: 1000  # high; the $25 per-position cap is the real limiter
  daily_loss_cap_usd: 50.0       # halts new entries when breached for the day
  min_confidence: 0.0            # strategies gate on their own edge; no extra confidence floor
  min_edge: 0.0                  # 0: strategy self-gates entries; a backstop here would also block exits

# ---------------------------------------------------------------------------
# STRATEGY — probability/sizing tunables for the systematic brain + exit monitor.
# These are strategy knobs, distinct from the hard USD caps in `risk:` above.
# Calibrate the longshot discounts against historical resolution data before
# widening. Omitting a key falls back to the conservative defaults in code.
# ---------------------------------------------------------------------------
strategy:
  bankroll_usd: 100.0            # capital base for Kelly sizing
  max_kelly: 0.25                # quarter-Kelly cap
  max_risk_per_position: 0.01    # hard cap: 1% of bankroll per position
  min_confidence: 0.60           # skip proposals below this
  max_theses: 10                 # cap simultaneous proposals per cycle
  # Exit triggers (monitor)
  target_fraction: 0.15          # close when bid <= 15% of entry price
  near_expiry_hours: 2.0         # close when < 2h to resolution
  stale_hours: 24.0              # consider stale after 24h held
  stale_move_pct: 0.02           # ...if price moved < 2%

# ---------------------------------------------------------------------------
# RELATIVE VALUE — external reference prices trigger Kalshi-only proposals.
# External venues are signal inputs only; all orders still route through Kalshi.
# ---------------------------------------------------------------------------
relative_value:
  enabled: true
  min_edge: 0.025
  min_match_confidence: 0.75
  max_signal_age_s: 30
  max_spread: 0.20
  max_markets: 200
  max_signals: 10
  order_count: 1
  allowed_sources:
    - polymarket

# ---------------------------------------------------------------------------
# SPORTSBOOK SCRAPE — targeted enrichment only. This never scans a sportsbook
# slate. It scrapes configured URLs only after the agent has proposed a Kalshi
# ticker, then uses the result as a reference signal before Kalshi execution.
# ---------------------------------------------------------------------------
sportsbook_scrape:
  enabled: false
  require_quote_for_agent: false
  timeout_s: 10
  max_response_bytes: 1000000
  min_parse_confidence: 0.55
  max_reference_disagreement: 0.25
  blend_weight: 0.50
  user_agent: "Mozilla/5.0 (compatible; kalshi-agent-trader/0.1; targeted odds check)"
  market_urls: {}
  # Example:
  # market_urls:
  #   KXEXAMPLE:
  #     - source: draftkings
  #       url: "https://sportsbook.draftkings.com/..."
  #       outcome: "Team A"
  #       side: yes
  #     - source: fanduel
  #       url: "https://sportsbook.fanduel.com/..."
  #       outcome: "Team A"
  #       side: yes

# ---------------------------------------------------------------------------
# MODELS — Claude model IDs per agent tier. The scout does cheap, high-volume
# triage (its misses are caught by the systematic filters + analyst pass), so it
# runs on Haiku. The analyst does the high-stakes per-candidate pricing on Sonnet.
# The analyst tier requires a Sonnet model; the scout tier rejects Sonnet models.
# ---------------------------------------------------------------------------
models:
  scout_model: claude-haiku-4-5-20251001
  analyst_model: claude-sonnet-4-6

# ---------------------------------------------------------------------------
# RUNTIME
# ---------------------------------------------------------------------------
runtime:
  request_timeout_s: 15
  # client-side throttle to stay under Basic tier (~10 auth req/s)
  max_requests_per_second: 8
  # set false when behind a corporate proxy that re-signs TLS (e.g. PEAK6)
  verify_ssl: false
