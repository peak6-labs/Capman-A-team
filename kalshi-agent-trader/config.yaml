# Kalshi agent-trader configuration.
# Secrets live in .env, NOT here. This file holds risk limits + compliance + tunables.
# Everything here is enforced in deterministic code (compliance.py / risk.py).

# ---------------------------------------------------------------------------
# COMPLIANCE — PEAK6 hard constraints. Enforced before any risk check and NOT
# overridable by agents. See README "Compliance".
# ---------------------------------------------------------------------------
compliance:
  # A market may trade ONLY if its event category is in allowed_categories
  # AND not in prohibited_categories AND passes the keyword screen.
  # Categories are resolved market -> event -> category (category is on the event).
  allowed_categories:
    - Politics
    - World
    - Climate and Weather
    - Sports
  prohibited_categories:   # hard deny — PEAK6: equities/ETFs/indices/options/companies/finance
    - Financials
    - Companies
    - Crypto
    - Economics
  # Default-deny everything else (Elections, Science and Technology, Entertainment,
  # Social, Health, Transportation) unless explicitly added to allowed_categories.
  default_deny_unknown: true
  # Keyword backstop on market/event title + series (case-insensitive substring).
  # Catches a prohibited market that slips into an allowed category.
  prohibited_keywords:
    - earnings
    - ipo
    - " s&p"
    - nasdaq
    - dow jones
    - merger
    - acquisition
    - stock
    - share price
    - "etf"

# ---------------------------------------------------------------------------
# RISK — configurable caps. FILL THESE IN before going live. Exposure is also
# bounded by actual account balance regardless of these values (no leverage).
# ---------------------------------------------------------------------------
risk:
  # KEEP TRUE until the research agent re-confirms a live edge. The three-leg
  # structure backtested ~flat-EV (June 2026); nothing trades live until you flip this.
  dry_run: true
  max_total_exposure_usd: 100.0
  max_per_position_usd: 5.0
  max_contracts_per_order: 10
  daily_loss_cap_usd: 10.0
  min_confidence: 0.6
  min_edge: 0.002

# ---------------------------------------------------------------------------
# STRATEGY — probability/sizing tunables for the systematic brain + exit monitor.
# These are strategy knobs, distinct from the hard USD caps in `risk:` above.
# Calibrate the longshot discounts against historical resolution data before
# widening. Omitting a key falls back to the conservative defaults in code.
# ---------------------------------------------------------------------------
strategy:
  bankroll_usd: 100.0            # capital base for Kelly sizing
  max_kelly: 0.25                # quarter-Kelly cap
  max_risk_per_position: 0.01    # hard cap: 1% of bankroll per position
  min_confidence: 0.60           # skip proposals below this
  max_theses: 10                 # cap simultaneous proposals per cycle
  # Exit triggers (monitor)
  target_fraction: 0.15          # close when bid <= 15% of entry price
  near_expiry_hours: 2.0         # close when < 2h to resolution
  stale_hours: 24.0              # consider stale after 24h held
  stale_move_pct: 0.02           # ...if price moved < 2%

# ---------------------------------------------------------------------------
# THREE-LEG — sizing defaults the research agent screens with, plus the
# executor's trade-ticket guards. The drift/staleness bands are copied into each
# ticket's frontmatter so the executor's validity check is self-contained.
# (Exploratory strategies — relative-value, longshot scanner/brain, dip-reversion,
#  the generic LLM agent — were retired to src/kalshi_agent_trader/attic/.)
# ---------------------------------------------------------------------------
three_leg:
  bankroll_usd: 100
  kelly_fraction: 0.5       # half-Kelly
  fatigue_coef: 0.20        # pts of conditional title prob lost per extra-set per rest-day
  fee_rate: 0.07            # Kalshi fee coefficient
  rest_days: 1              # QF→SF turnaround; fewer ⇒ bigger length hedge
  # Executor guards:
  ticket_max_age_min: 30    # refuse a trade ticket older than this
  drift_tolerance_match: 0.02   # abort if the live match ask drifts past this vs the ticket
  drift_tolerance_title: 0.03   # ...and likewise for the title ask

# ---------------------------------------------------------------------------
# RUNTIME
# ---------------------------------------------------------------------------
runtime:
  request_timeout_s: 15
  # client-side throttle to stay under Basic tier (~10 auth req/s)
  max_requests_per_second: 8
  # set false when behind a corporate proxy that re-signs TLS (e.g. PEAK6)
  verify_ssl: false
